name: VOD Control Plane CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Install control plane dependencies
        run: python -m pip install -r controlplane/requirements.txt
      - name: Syntax check
        run: python -m compileall plugin/vod_catalog_manager
      - name: Unit tests
        run: python -m pytest tests controlplane/tests -q
      - name: Frontend syntax check
        run: node --check controlplane/frontend/app.js
