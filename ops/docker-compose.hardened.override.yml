# Hardened override/template for the existing modular Dispatcharr deployment.
# Do not use this file alone. Keep the original compose service definitions.
# Put all secrets and image references in an untracked .env file.

services:
  web:
    image: ${DISPATCHARR_IMAGE:?set DISPATCHARR_IMAGE in .env}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      HF_TOKEN: ${HF_TOKEN:?set HF_TOKEN in .env if required}
      MEDIA_SECRET_KEY: ${MEDIA_SECRET_KEY:?set MEDIA_SECRET_KEY in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9191}
      DISPATCHARR_TRUSTED_PROXIES: ${DISPATCHARR_TRUSTED_PROXIES:-172.18.0.0/16}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  celery:
    image: ${DISPATCHARR_IMAGE:?set DISPATCHARR_IMAGE in .env}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DJANGO_SETTINGS_MODULE: dispatcharr.settings
      PYTHONUNBUFFERED: "1"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in .env}
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE in .env}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
